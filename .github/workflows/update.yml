name: Update AI jobs (13:00 Beijing)
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-job-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test rules and persistence
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension data and notification logic
        run: node tests/extension.test.mjs
      - name: Collect public employer feeds
        run: python collector/monitor.py
      - name: Commit only recruitment data (no applicant records)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/feed.json data/status.json data/weekly.json extension/seed.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public AI job feed'
            git push
          fi
      - name: Save diagnostic status even if collection failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-status
          path: data/status.json
          retention-days: 7
